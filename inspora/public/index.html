<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal portfolio — Inspora</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./page.js" defer></script>
</head>
<body>
  <main class="dialog" aria-label="Personal portfolio">
    <section class="visual" aria-label="Portfolio preview">
      <div class="preview-frame"><img src="./assets/page-reference.png" alt="Dark personal portfolio preview" /></div>
      <a class="bottom-close" href="/" aria-label="Close preview">×</a>
    </section>
    <aside class="details">
      <div class="topbar"><a class="icon-button" href="/" aria-label="Close">×</a><div class="arrows"><button class="icon-button" aria-label="Previous post" disabled>←</button><button class="icon-button" aria-label="Next post" disabled>→</button></div></div>
      <div class="copy"><span class="tag">Web</span><h1>Personal portfolio</h1><div class="creator"><img src="./assets/creator.webp" alt="" /><span>@emblemo</span></div><p>Personal portfolio</p><a class="original" href="https://x.com/emblemo" target="_blank" rel="noopener noreferrer">View original</a></div>
      <form class="subscribe" id="subscribe-form"><div class="subscribe-row"><input type="email" aria-label="Email address" placeholder="you@email.com" required /><button type="submit">subscribe</button></div><small id="subscribe-message">Subscribe to a weekly email</small></form>
    </aside>
  </main>
</body>
</html>
